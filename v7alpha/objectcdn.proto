syntax = "proto3";

package ryvion.v7alpha;

option go_package = "github.com/Ryvion/proto/v7alpha;v7alphapb";

import "v7alpha/common.proto";

// objectcdn.proto defines additive V7 alpha metadata contracts for
// content-addressed object delivery, local cache advertisement, manifests, and
// forward error correction planning.
//
// These messages identify objects by CID and hash references only. Raw object
// bytes and any raw object transfer happen outside these metadata messages.

// ObjectKind identifies the semantic class of a content-addressed object.
enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_MODEL_CHUNK = 1;
  OBJECT_KIND_RUNNER_LAYER = 2;
  OBJECT_KIND_RENDER_ASSET = 3;
  OBJECT_KIND_VIDEO_SEGMENT = 4;
  OBJECT_KIND_RECEIPT_BUNDLE = 5;
  OBJECT_KIND_EVIDENCE_BUNDLE = 6;
  OBJECT_KIND_ARTIFACT = 7;
}

// ObjectChunk describes one content-addressed chunk in an object manifest.
message ObjectChunk {
  uint64 index = 1;
  CID object_id = 2;
  uint64 offset_bytes = 3;
  uint64 size_bytes = 4;
  HashRef hash = 5;
}

// ObjectManifest describes the chunk layout and identity for one object. Pair it
// with FECPlan when recovery planning metadata is available.
message ObjectManifest {
  CID object_id = 1;
  ObjectKind kind = 2;
  uint64 total_bytes = 3;
  repeated ObjectChunk chunks = 4;
  int64 created_at_unix_ms = 5;
}

// CacheObjectSummary summarizes one locally cached CAS object without exposing
// raw object data.
message CacheObjectSummary {
  CID object_id = 1;
  ObjectKind kind = 2;
  uint64 size_bytes = 3;
  int64 created_at_unix_ms = 4;
}

// CacheAdvertisement summarizes a node's local content-addressed cache.
message CacheAdvertisement {
  string node_id = 1;
  int64 generated_at_unix_ms = 2;
  repeated CacheObjectSummary objects = 3;
  uint64 total_bytes = 4;
  bool truncated = 5;
}

// FECPolicy describes how a consumer should plan recovery symbol requests.
message FECPolicy {
  uint32 data_shards = 1;
  uint32 parity_shards = 2;
  uint64 symbol_size_bytes = 3;
  uint32 overfetch_percent = 4;
  uint32 max_sources = 5;
}

// FECSymbol identifies one planned recovery symbol request. It does not contain
// encoded symbol bytes.
message FECSymbol {
  string symbol_id = 1;
  uint32 index = 2;
  uint64 offset_bytes = 3;
  uint64 size_bytes = 4;
  repeated string preferred_source_ids = 5;
}

// FECPlan is planning metadata for recovery symbol selection, not the actual
// encoded symbols or object bytes.
message FECPlan {
  CID object_id = 1;
  FECPolicy policy = 2;
  uint32 required_symbols = 3;
  repeated FECSymbol symbols = 4;
}
