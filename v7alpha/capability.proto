syntax = "proto3";

package ryvion.v7alpha;

option go_package = "github.com/Ryvion/proto/v7alpha;v7alphapb";

// CapabilityPassport reports factual node-agent capabilities for future hub-orch
// placement and risk decisions. It must not contain secrets, admin keys, bind
// tokens, or scheduling decisions.
message CapabilityPassport {
  string schema_version = 1;
  string agent_version = 2;
  string node_public_key = 3;
  string os = 4;
  string arch = 5;
  string device_type = 6;
  string declared_country = 7;
  HardwareProfile hardware = 8;
  RuntimeProfile runtime = 9;
  NetworkCapabilitySummary network = 10;
  ModelCapabilitySummary model = 11;
  SandboxCapabilitySummary sandbox = 12;
  CASCapabilitySummary cas = 13;
  EvidenceCapabilitySummary evidence = 14;
  int64 created_at_unix_ms = 15;
}

// HardwareProfile describes local compute hardware claims measured by node-agent.
message HardwareProfile {
  uint32 cpu_cores = 1;
  uint64 ram_bytes = 2;
  string gpu_model = 3;
  uint64 vram_bytes = 4;
  string gpu_vendor = 5;
  string driver_version = 6;
  bool tee_supported = 7;
  string tee_type = 8;
}

// RuntimeProfile describes local runtime availability without making placement
// decisions.
message RuntimeProfile {
  bool native_inference_supported = 1;
  bool oci_available = 2;
  bool llama_server_available = 3;
  bool image_runtime_available = 4;
  repeated string supported_runner_kinds = 5;
}

// NetworkCapabilitySummary describes measured network capability. Values can be
// zero when unknown or not measured.
message NetworkCapabilitySummary {
  double upload_mbps_p50 = 1;
  double upload_mbps_p95 = 2;
  double download_mbps_p50 = 3;
  double download_mbps_p95 = 4;
  double rtt_ms_p50 = 5;
  double rtt_ms_p95 = 6;
  double jitter_ms_p95 = 7;
  double loss_rate_p95 = 8;
}

// ModelCapabilitySummary describes local model format and residency capability.
// Unsafe model formats such as pickle should be rejected or sandboxed by policy,
// not advertised as a safe capability.
message ModelCapabilitySummary {
  repeated string supported_model_formats = 1;
  repeated string resident_model_ids = 2;
  uint64 max_resident_model_bytes = 3;
  bool supports_model_lease = 4;
}

// SandboxCapabilitySummary describes local sandbox policy support.
message SandboxCapabilitySummary {
  bool rejects_unsafe_pickle = 1;
  bool runner_allowlist_enabled = 2;
  bool filesystem_isolation_planned = 3;
  bool network_isolation_supported = 4;
}

// CASCapabilitySummary describes local content-addressed storage capability.
message CASCapabilitySummary {
  bool enabled = 1;
  // Optional non-secret hint, not a secret path if used.
  string root_hint = 2;
  uint64 max_bytes = 3;
}

// EvidenceCapabilitySummary describes local evidence production support.
message EvidenceCapabilitySummary {
  bool supports_artifact_manifest = 1;
  bool supports_ryv3_evidence_payload = 2;
  bool supports_runtime_hash = 3;
}
