syntax = "proto3";

package ryvion.v7alpha;

option go_package = "github.com/Ryvion/proto/v7alpha;v7alphapb";

import "v7alpha/common.proto";

// network.proto defines additive V7 alpha contracts for measured node-agent
// network reports and future hub-orch PathOracle scoring. These messages are
// measurements and scoring inputs, not networking implementation or scheduling
// decisions.
//
// Prefer stable target, region, relay, POP, or cache identifiers over raw
// private addresses. Do not include IP secrets, bind tokens, or private network
// coordinates unless a future explicit task requires them.

// PathKind identifies the class of path being measured or scored.
enum PathKind {
  PATH_KIND_UNSPECIFIED = 0;
  PATH_KIND_DIRECT = 1;
  PATH_KIND_RELAY = 2;
  PATH_KIND_MULTIPATH = 3;
  PATH_KIND_CACHE = 4;
}

// TrafficClass identifies broad traffic priorities for path scoring.
//
// C0/C1 critical traffic should not be blocked by bulk artifact traffic, and
// weak upload nodes must not be assigned tensor-heavy critical-path roles.
enum TrafficClass {
  TRAFFIC_CLASS_UNSPECIFIED = 0;
  TRAFFIC_CLASS_COMMIT_CRITICAL = 1;
  TRAFFIC_CLASS_VERIFICATION_CRITICAL = 2;
  TRAFFIC_CLASS_INTERACTIVE_STREAM = 3;
  TRAFFIC_CLASS_WARM_PREFETCH = 4;
  TRAFFIC_CLASS_ARTIFACT_UPLOAD = 5;
  TRAFFIC_CLASS_BULK_CACHE_FILL = 6;
}

// NetworkProfile reports measured network capability. Upload is a first-class
// resource because artifact delivery and critical-path tensor movement can be
// upload-bound.
message NetworkProfile {
  double upload_mbps_p50 = 1;
  double upload_mbps_p95 = 2;
  double download_mbps_p50 = 3;
  double download_mbps_p95 = 4;
  double rtt_ms_p50 = 5;
  double rtt_ms_p95 = 6;
  double jitter_ms_p95 = 7;
  double loss_rate_p95 = 8;
  string probe_target = 9;
  uint32 sample_count = 10;
  int64 measured_at_unix_ms = 11;
}

// PathProbeReport is emitted by node-agent for a target or region identifier.
// It records measurements only and must not encode placement decisions.
message PathProbeReport {
  string node_id = 1;
  string target = 2;
  NetworkProfile profile = 3;
}

// PathProfile describes observed or estimated path quality for PathOracle
// scoring without exposing raw private network addresses.
message PathProfile {
  string src_id = 1;
  string dst_id = 2;
  PathKind path_kind = 3;
  string relay_id = 4;
  double rtt_ms_p50 = 5;
  double rtt_ms_p95 = 6;
  double jitter_ms_p95 = 7;
  double loss_p95 = 8;
  double upload_mbps_p95 = 9;
  double download_mbps_p95 = 10;
  double delivery_mbps_p95 = 11;
  double queue_delay_ms_p95 = 12;
  double availability = 13;
  double cost_per_gb = 14;
  int64 last_measured_at_unix_ms = 15;
}

// PathRequirement describes caller needs for future PathOracle scoring.
message PathRequirement {
  double max_latency_ms = 1;
  uint64 bytes_out_estimate = 2;
  double upload_budget_ms = 3;
  bool critical_path = 4;
  string prefer_region = 5;
  double max_cost_per_gb = 6;
  bool allow_relay = 7;
  bool allow_multipath = 8;
  bool allow_cache = 9;
  TrafficClass traffic_class = 10;
}

// PathScore records explainable scoring components for a candidate path.
message PathScore {
  double total = 1;
  double latency_component = 2;
  double jitter_component = 3;
  double queue_component = 4;
  double loss_component = 5;
  double cost_component = 6;
  double availability_component = 7;
  repeated string reasons = 8;
}
