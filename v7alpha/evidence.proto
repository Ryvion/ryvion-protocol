syntax = "proto3";

package ryvion.v7alpha;

option go_package = "github.com/Ryvion/proto/v7alpha;v7alphapb";

import "v7alpha/common.proto";

// evidence.proto defines additive V7 alpha contracts for node-agent
// proof-carrying evidence. Evidence is not the final RYV3 receipt.
//
// Node-agent provides these payloads after execution. Hub-orch validates them
// and produces the final RYV3 receipt by binding accepted evidence into an
// RYV3GraphReceipt.
//
// Evidence messages must reference hashes, CIDs, and object IDs only. They must
// not contain raw prompt text, raw transcript text, raw output bytes, secrets,
// or private keys.

// RYV3EvidencePayload is the node-agent evidence payload that hub-orch can
// validate and bind into a final RYV3GraphReceipt.
message RYV3EvidencePayload {
  string schema_version = 1;
  string job_id = 2;
  string assignment_id = 3;
  string node_id = 4;
  int64 execution_started_at_unix_ms = 5;
  int64 execution_finished_at_unix_ms = 6;
  RuntimeEvidence runtime = 7;
  ModelEvidence model = 8;
  OutputEvidence output = 9;
  repeated ArtifactEvidence artifacts = 10;
}

// RuntimeEvidence records non-secret runner identity and environment hashes.
message RuntimeEvidence {
  string agent_version = 1;
  string runner_kind = 2;
  HashRef runtime_hash = 3;
  string os = 4;
  string arch = 5;
}

// ModelEvidence references the model object used for execution without
// embedding model bytes or secrets.
message ModelEvidence {
  string model_id = 1;
  string model_revision = 2;
  string quantization_id = 3;
  CID model_object_id = 4;
  string model_format = 5;
}

// OutputEvidence records output digest and metering only. It must not embed raw
// output bytes.
message OutputEvidence {
  HashRef output_hash = 1;
  uint64 output_bytes = 2;
  int64 metering_units = 3;
}

// ArtifactEvidence references one produced artifact by object ID and digest.
message ArtifactEvidence {
  string artifact_id = 1;
  string kind = 2;
  CID object_id = 3;
  HashRef sha256 = 4;
  uint64 size_bytes = 5;
}

// ProofCarryingRunnerOutput packages the primary runner artifact with the
// node-agent evidence payload. Hub-orch still produces the final RYV3 receipt
// after validation.
message ProofCarryingRunnerOutput {
  ArtifactEvidence primary_artifact = 1;
  RYV3EvidencePayload evidence = 2;
  repeated CID cas_object_references = 3;
}
