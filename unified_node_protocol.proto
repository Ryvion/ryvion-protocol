syntax = "proto3";

package ryvion.depin.v1;

option go_package = "github.com/Ryvion/proto/depin/v1;depinv1";

// DePIN Device Categories
enum DeviceClass {
  DEVICE_CLASS_UNSPECIFIED = 0;
  DEVICE_CLASS_GPU_CLUSTER = 1;    // High-end GPU farms for AI inference
  DEVICE_CLASS_EDGE_AI = 2;        // Edge AI devices (phones, IoT)
  DEVICE_CLASS_STORAGE = 3;        // Distributed storage nodes
  DEVICE_CLASS_COMPUTE = 4;        // General compute nodes
  DEVICE_CLASS_SENSOR = 5;         // IoT sensor networks
  DEVICE_CLASS_RELAY = 6;          // Network relay/bandwidth nodes
}

message NodeCapabilities {
  DeviceClass device_class = 1;
  string gpu_model = 2;
  uint32 gpu_cc = 3;              // CUDA compute capability
  uint32 cpu_cores = 4;
  uint64 ram_bytes = 5;
  uint64 vram_bytes = 6;
  uint64 storage_bytes = 7;       // Available storage for DePIN
  uint64 bandwidth_mbps = 8;
  repeated string ai_models = 9;   // Supported AI model types
  bool green_certified = 10;      // Renewable energy attestation
  double power_efficiency = 11;   // Performance per watt
}

message RegisterNodeRequest {
  bytes pubkey = 1;               // ed25519 pubkey
  NodeCapabilities caps = 2;
  uint64 geohash_bucket = 3;
  uint32 attestation_method = 4;  // enum later
  bytes signature = 5;            // over serialized body
}
message RegisterNodeResponse { string node_id = 1; }

message Heartbeat {
  bytes pubkey = 1;
  int64 timestamp_ms = 2;
  double cpu_util = 3;
  double mem_util = 4;
  double gpu_util = 5;
  double power_watts = 6;
  bytes signature = 7;
}
message HeartbeatAck { bool ok = 1; string msg = 2; }

message WorkRequest { bytes pubkey = 1; }
message WorkAssignment {
  string job_id = 1;
  string kind = 2;         // inference, batch, sensing
  string payload_url = 3;  // v0 link to payload
  bytes payload_hash = 4;  // sha256 of payload
  uint64 price_per_unit = 5; // price per unit in minor currency units
  uint32 units = 6;        // granularity depends on job kind
  // Optional v0.2: OCI runner
  string image = 7;        // container image ref (e.g., ghcr.io/acme/llm-runner:0.1.0)
  string spec_json = 8;    // JobSpec JSON per docs/runner-contract.md
}

message WorkReceipt {
  string job_id = 1;
  bytes pubkey = 2;
  bytes result_hash = 3;
  uint64 metering_units = 4;
  uint32 green_multiplier_bps = 5; // basis points, e.g. 11000 = 1.1x
  bytes signature = 6;
}
message ReceiptAck { bool ok = 1; string msg = 2; }

// DePAI Job Categories
enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_LLM_INFERENCE = 1;      // Large Language Model inference
  JOB_KIND_IMAGE_GENERATION = 2;   // AI image/art generation
  JOB_KIND_VIDEO_TRANSCODE = 3;    // Video processing pipeline
  JOB_KIND_DATA_PROCESSING = 4;    // ETL and data transformation
  JOB_KIND_MODEL_TRAINING = 5;     // Distributed AI model training
  JOB_KIND_EMBEDDING = 6;          // Vector embeddings generation
  JOB_KIND_IOT_AGGREGATION = 7;    // IoT sensor data processing
  JOB_KIND_STORAGE_REPLICATION = 8; // DePIN storage replication
}

message PostJobRequest {
  JobKind kind = 1;
  string payload_url = 2;          // job spec / docker image
  uint64 max_price_per_unit = 3;   // max price willing to pay (in minor currency units)
  uint64 budget = 4;               // total budget in minor currency units (e.g. cents)
  string region = 5;               // geographic preference
  repeated string required_capabilities = 6; // e.g., ["cuda", "llama-2-7b"]
  bool green_only = 7;             // require renewable energy nodes
  uint32 min_reputation = 8;       // minimum node reputation score
  string currency = 10;            // ISO 4217 currency code, e.g. "CAD", "USD"
}
message PostJobResponse { 
  string job_id = 1; 
  uint64 estimated_cost = 2;       // estimated total cost
  uint32 estimated_duration_ms = 3; // estimated completion time
}

message GetQuotesRequest { string kind = 1; string region = 2; }
message Quote { string kind = 1; uint64 median_price = 2; uint32 capacity = 3; }
message GetQuotesResponse { repeated Quote quotes = 1; }

// Core DePIN orchestration service
service DePINOrchestrator {
  rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc SendHeartbeat (Heartbeat) returns (HeartbeatAck);
  rpc RequestWork (WorkRequest) returns (WorkAssignment);
  rpc SubmitReceipt (WorkReceipt) returns (ReceiptAck);
  
  // Additional DePIN features
  rpc GetNetworkHealth (NetworkHealthRequest) returns (NetworkHealthResponse);
}

// DePAI job marketplace service  
service DePAIMarketplace {
  rpc PostJob (PostJobRequest) returns (PostJobResponse);
  rpc GetQuotes (GetQuotesRequest) returns (GetQuotesResponse);

  // AI-specific features
  rpc GetModelCapabilities (ModelCapabilitiesRequest) returns (ModelCapabilitiesResponse);
  rpc EstimateJobCost (EstimateRequest) returns (EstimateResponse);
}

// Network health monitoring
message NetworkHealthRequest { string region = 1; }
message NetworkHealthResponse {
  uint32 active_nodes = 1;
  uint32 total_compute_units = 2;
  double average_utilization = 3;
  uint32 jobs_in_queue = 4;
}

// AI model capabilities discovery
message ModelCapabilitiesRequest { repeated string model_names = 1; }
message ModelCapabilitiesResponse {
  repeated ModelInfo available_models = 1;
}
message ModelInfo {
  string name = 1;                // "llama-2-70b", "stable-diffusion-xl"
  uint32 min_vram_gb = 2;         // minimum VRAM required
  uint32 available_nodes = 3;     // nodes that can run this model
  uint64 avg_price_per_token = 4; // average pricing
}

// Job cost estimation
message EstimateRequest {
  JobKind kind = 1;
  uint32 estimated_tokens = 2;    // for LLM jobs
  uint32 estimated_images = 3;    // for image generation
  uint32 estimated_duration_ms = 4;
}
message EstimateResponse {
  uint64 min_cost = 1;
  uint64 max_cost = 2;
  uint64 recommended_budget = 3;
}
