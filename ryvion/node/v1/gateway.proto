syntax = "proto3";

package ryvion.node.v1;

option go_package = "github.com/Ryvion/ryvion-protocol/gen/go/ryvion/node/v1;nodev1";

import "google/protobuf/struct.proto";

// NodeGateway is the canonical outbound node-to-hub control stream.
// Public buyer APIs remain HTTP; this service is internal.
service NodeGateway {
  rpc Connect(stream NodeToHub) returns (stream HubToNode);
}

message NodeToHub {
  string node_id = 1;
  string message_id = 2;
  int64 created_at_unix_ms = 3;

  oneof payload {
    NodeHello hello = 10;
    NodeHeartbeat heartbeat = 11;
    WorkReceipt receipt = 14;
    WorkLeaseRequest work_lease_request = 15;
  }

  Signature signature = 100;

  reserved 12, 13;
}

message HubToNode {
  string message_id = 1;
  int64 created_at_unix_ms = 2;

  oneof payload {
    WorkAssignment assignment = 10;
    AbortCommand abort = 11;
    Ping ping = 15;
    NodeHeartbeatAck heartbeat_ack = 16;
    WorkLeaseAck work_lease_ack = 17;
    WorkReceiptAck receipt_ack = 18;
  }

  reserved 12, 13, 14, 19;
}

message Signature {
  string key_id = 1;
  string algorithm = 2;
  bytes signature = 3;
}

message NodeHello {
  string public_key_hex = 1;
  string agent_version = 2;
  string os = 3;
  string arch = 4;
}

message NodeHeartbeat {
  string public_key_hex = 1;
  int64 timestamp_ms = 2;
  double cpu_util = 3;
  double mem_util = 4;
  double gpu_util = 5;
  double power_watts = 6;
  google.protobuf.Struct capability_payload = 7;
  bool gpu_throttled = 8;
  string system_timezone = 9;
  google.protobuf.Struct network_profile = 10;
}

message NodeHeartbeatAck {
  bool ok = 1;
  string node_id = 2;
  uint32 next_heartbeat_interval = 3;
  string country_code = 4;
  bool location_approved = 5;
  bool sovereign_verified = 6;
  string verification_source = 7;
  string trust_reason = 8;
  bool capability_profile_upserted = 9;
  uint32 profile_runtime_count = 10;
  uint32 profile_backend_count = 11;
  bool has_capability_profile = 12;
  string hub_instance_id = 13;
  repeated string ignored_optional_fields = 14;
  string latest_version = 15;
}

message WorkAssignment {
  string job_id = 1;
  string kind = 2;
  string payload_url = 3;
  string image = 4;
  string spec_json = 5;
  string executor_kind = 6;
  uint32 units = 7;
  // Deprecated: older nodes used this as the active abort/lease scope.
  string workgraph_id = 8;
  string job_pubkey = 9;
  uint64 price_per_unit = 10;
  string assurance_class = 11;
  RuntimeRequirements runtime_requirements = 12;
  string abort_scope_id = 13;
}

message RuntimeRequirements {
  bool needs_gpu = 1;
  bool needs_managed_oci = 2;
  bool needs_managed_oci_gpu = 3;
  bool needs_ryvion_runtime = 4;
  bool needs_llama_cpp = 13;
  repeated string tooling = 8;
  uint64 min_disk_gb = 9;
  uint32 min_vram_mb = 10;
  string jurisdiction = 11;
  string trust_level = 12;

  reserved 5, 6, 7;
}

message WorkLeaseRequest {
  string public_key_hex = 1;
  int64 timestamp_ms = 2;
  bool long_poll = 3;
}

message WorkLeaseAck {
  bool has_work = 1;
  WorkAssignment assignment = 2;
  string reason = 3;
  uint32 retry_in_seconds = 4;
  string message = 5;
}

message AbortCommand {
  string job_id = 1;
  string reason = 2;
}

message Ping {
  string nonce = 1;
}

message WorkReceipt {
  string job_id = 1;
  string public_key_hex = 2;
  string result_hash_hex = 3;
  uint64 metering_units = 4;
  google.protobuf.Struct metadata = 5;
}

message WorkReceiptAck {
  bool accepted = 1;
  string status = 2;
  string receipt_id = 3;
  string reason = 4;
  google.protobuf.Struct metadata = 5;
}
