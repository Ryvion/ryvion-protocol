syntax = "proto3";

package ryvion.node.v1;

option go_package = "github.com/Ryvion/ryvion-protocol/gen/go/ryvion/node/v1;nodev1";

import "google/protobuf/struct.proto";

// NodeGateway is the canonical outbound node-to-hub control stream.
// Public buyer APIs remain HTTP/OpenAI-compatible; this service is internal.
service NodeGateway {
  rpc Connect(stream NodeToHub) returns (stream HubToNode);
}

message NodeToHub {
  string node_id = 1;
  string message_id = 2;
  int64 created_at_unix_ms = 3;

  oneof payload {
    NodeHello hello = 10;
    NodeHeartbeat heartbeat = 11;
    DraftPacketBatch draft_packet_batch = 12;
    VerifierResult verifier_result = 13;
    WorkReceipt receipt = 14;
    WorkLeaseRequest work_lease_request = 15;
    LiveLabCommandRequest live_lab_command_request = 16;
    LiveLabVerifierResult live_lab_verifier_result = 17;
  }

  Signature signature = 100;
}

message HubToNode {
  string message_id = 1;
  int64 created_at_unix_ms = 2;

  oneof payload {
    WorkAssignment assignment = 10;
    AbortCommand abort = 11;
    DraftCommand draft_command = 12;
    VerifierCommand verifier_command = 13;
    RuntimeWarmCommand runtime_warm = 14;
    Ping ping = 15;
    NodeHeartbeatAck heartbeat_ack = 16;
    WorkLeaseAck work_lease_ack = 17;
    WorkReceiptAck receipt_ack = 18;
    DraftPacketBatchAck draft_packet_batch_ack = 19;
    LiveLabCommand live_lab_command = 20;
    LiveLabVerifierResultAck live_lab_verifier_result_ack = 21;
  }
}

message Signature {
  string key_id = 1;
  string algorithm = 2;
  bytes signature = 3;
}

message NodeHello {
  string public_key_hex = 1;
  string agent_version = 2;
  string os = 3;
  string arch = 4;
}

message NodeHeartbeat {
  string public_key_hex = 1;
  int64 timestamp_ms = 2;
  double cpu_util = 3;
  double mem_util = 4;
  double gpu_util = 5;
  double power_watts = 6;
  google.protobuf.Struct capability_payload = 7;
  bool gpu_throttled = 8;
  string system_timezone = 9;
  google.protobuf.Struct network_profile = 10;
}

message NodeHeartbeatAck {
  bool ok = 1;
  string node_id = 2;
  uint32 next_heartbeat_interval = 3;
  string country_code = 4;
  bool location_approved = 5;
  bool sovereign_verified = 6;
  string verification_source = 7;
  string trust_reason = 8;
  bool v7_snapshot_upserted = 9;
  uint32 snapshot_model_count = 10;
  uint32 snapshot_backend_count = 11;
  bool has_capability_profile = 12;
  string hub_instance_id = 13;
  repeated string ignored_optional_fields = 14;
  string latest_version = 15;
}

message WorkAssignment {
  string job_id = 1;
  string kind = 2;
  string payload_url = 3;
  string image = 4;
  string spec_json = 5;
  string executor_kind = 6;
  uint32 units = 7;
  string workgraph_id = 8;
  string job_pubkey = 9;
  uint64 price_per_unit = 10;
  string assurance_class = 11;
  RuntimeRequirements runtime_requirements = 12;
}

message RuntimeRequirements {
  bool needs_gpu = 1;
  bool needs_managed_oci = 2;
  bool needs_managed_oci_gpu = 3;
  bool needs_ryvion_runtime = 4;
  bool needs_native_streaming = 5;
  bool needs_native_report = 6;
  bool needs_agent_hosting = 7;
  repeated string tooling = 8;
  uint64 min_disk_gb = 9;
  uint32 min_vram_mb = 10;
  string jurisdiction = 11;
  string trust_level = 12;
}

message WorkLeaseRequest {
  string public_key_hex = 1;
  int64 timestamp_ms = 2;
  bool long_poll = 3;
}

message WorkLeaseAck {
  bool has_work = 1;
  WorkAssignment assignment = 2;
  string reason = 3;
  uint32 retry_in_seconds = 4;
  string message = 5;
}

message AbortCommand {
  string job_id = 1;
  string reason = 2;
}

message DraftCommand {
  string run_id = 1;
  string window_id = 2;
  string workgraph_id = 3;
  string prefix_hash = 4;
  uint32 horizon = 5;
  uint32 branch_count = 6;
  google.protobuf.Struct policy = 7;
}

message VerifierCommand {
  string run_id = 1;
  string session_id = 2;
  string command_id = 3;
  string method = 4;
  google.protobuf.Struct payload = 5;
}

message RuntimeWarmCommand {
  string model_id = 1;
  string model_path = 2;
  google.protobuf.Struct runtime_tuning = 3;
}

message Ping {
  string nonce = 1;
}

message DraftPacketBatch {
  string run_id = 1;
  string window_id = 2;
  repeated google.protobuf.Struct packets = 3;
}

message DraftPacketDecision {
  string packet_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message DraftPacketBatchAck {
  string schema_version = 1;
  string window_id = 2;
  uint32 attempted = 3;
  uint32 accepted = 4;
  uint32 rejected = 5;
  repeated DraftPacketDecision decisions = 6;
}

message LiveLabCommandRequest {
  string run_id = 1;
  string job_id = 2;
  string role = 3;
}

message LiveLabCommand {
  string schema_version = 1;
  string run_id = 2;
  string job_id = 3;
  string role = 4;
  string command = 5;
  string command_id = 6;
  string reason = 7;
  google.protobuf.Struct payload = 8;
}

message LiveLabVerifierResult {
  string run_id = 1;
  string job_id = 2;
  string window_id = 3;
  uint32 wave_index = 4;
  uint32 accepted_len = 5;
  string tree_cid = 6;
  int64 duration_ms = 7;
  string accepted_text_hash = 8;
  bool accepted_text_public = 9;
  bool eos = 10;
  string stop_reason = 11;
  google.protobuf.Struct probe_summary = 12;
}

message LiveLabVerifierResultAck {
  string schema_version = 1;
  string status = 2;
  string run_id = 3;
  string window_id = 4;
  string reason = 5;
  google.protobuf.Struct metadata = 6;
}

message VerifierResult {
  string run_id = 1;
  string command_id = 2;
  string tree_cid = 3;
  uint32 accepted_len = 4;
  string accepted_token_hash = 5;
  google.protobuf.Struct receipt = 6;
}

message WorkReceipt {
  string job_id = 1;
  string public_key_hex = 2;
  string result_hash_hex = 3;
  uint64 metering_units = 4;
  google.protobuf.Struct metadata = 5;
}

message WorkReceiptAck {
  bool accepted = 1;
  string status = 2;
  string receipt_id = 3;
  string reason = 4;
  google.protobuf.Struct metadata = 5;
}
